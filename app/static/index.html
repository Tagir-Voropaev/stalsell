<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // 🔑 Если уже заходили в этой сессии — отключаем анимацию hero
        if (sessionStorage.getItem('stalsell_visited')) {
            document.documentElement.classList.add('no-anim');
        } else {
            sessionStorage.setItem('stalsell_visited', '1');
        }
    </script>
    <title>StalSell — История аукциона STALZONE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="home-page">
    <header class="hero">
        <div class="hero-top-nav">
            <a href="/static/profile.html" class="nav-link" id="profileBtn" style="display:none;">
                <i class="bi bi-person"></i> Профиль
            </a>
            <a href="/static/login.html" class="nav-link" id="loginBtn">Войти</a>
            <a href="#" class="nav-link" id="logoutBtn" style="display:none;">Выйти</a>
        </div>

        <h1 class="hero-title">StalSell</h1>
        <p class="hero-subtitle">История аукциона STALZONE</p>

        <!-- Поиск -->
        <div class="hero-search" id="searchContainer">
            <input type="text" id="searchInput" placeholder="Введите название предмета" autocomplete="off"
                oninput="onSearchInput()" onkeydown="onSearchKeydown(event)" onfocus="onSearchFocus()">
            <button class="hero-search-btn" onclick="goToFirstSuggestion()" aria-label="Поиск">
                <i class="bi bi-search"></i>
            </button>
            <div id="suggestions" class="suggestions" style="display:none;"></div>
        </div>

        <!-- Категории -->
        <div class="hero-nav">
            <button class="hero-nav-btn" onclick="quickCategorySearch('artefact')">
                <i class="bi bi-gem hero-nav-icon"></i>
                <span>Артефакты</span>
            </button>
            <button class="hero-nav-btn" onclick="quickCategorySearch('weapon')">
                <i class="bi bi-crosshair hero-nav-icon"></i>
                <span>Оружие</span>
            </button>
            <button class="hero-nav-btn" onclick="quickCategorySearch('armor')">
                <i class="bi bi-shield hero-nav-icon"></i>
                <span>Броня</span>
            </button>
            <button class="hero-nav-btn" onclick="quickCategorySearch('other')">
                <i class="bi bi-box-seam hero-nav-icon"></i>
                <span>Прочее</span>
            </button>
            <a href="/static/login.html" class="hero-nav-btn">
                <i class="bi bi-person hero-nav-icon"></i>
                <span>Профиль</span>
            </a>
        </div>
    </header>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</body>

</html>
