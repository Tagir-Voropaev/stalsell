<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — StalSell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="top-header">
        <div class="header-top">
            <a href="/static/index.html" class="nav-link"><i class="bi bi-arrow-left"></i> На главную</a>
        </div>
        <h1 class="site-title">StalSell</h1>
        <p class="site-subtitle">Профиль сталкера</p>
    </header>

    <main>
        <div class="profile-container">
            <div class="profile-card">
                <div class="profile-avatar">
                    <i class="bi bi-person-circle"></i>
                </div>
                <h2 id="profileUsername">Загрузка...</h2>

                <p class="profile-label">Email</p>
                <p class="profile-value" id="profileEmail">—</p>

                <p class="profile-label">ID</p>
                <p class="profile-value" id="profileId">—</p>

                <div class="profile-actions">
                    <button class="action-btn secondary" onclick="window.location.href='/static/index.html'">
                        <i class="bi bi-search"></i> К поиску
                    </button>
                    <button class="action-btn secondary" id="profileLogoutBtn">
                        <i class="bi bi-box-arrow-right"></i> Выйти
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/profile.js"></script>
</body>
</html>
